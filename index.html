<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hand Figure</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #05060a;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', sans-serif;
        color: #e8ecf5;
      }
      video,
      canvas {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
      }
      video {
        object-fit: cover;
        transform: scaleX(-1);
        filter: brightness(0.55) saturate(0.85);
      }
      #scene {
        will-change: filter;
      }
      #instagram-link {
        position: fixed;
        z-index: 3;
        top: 18px;
        right: 18px;
        padding: 9px 13px;
        border: 1px solid rgba(255, 190, 220, 0.32);
        border-radius: 999px;
        background: rgba(25, 12, 30, 0.72);
        color: #ffe8f2;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.02em;
        text-decoration: none;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.55);
        -webkit-backdrop-filter: blur(8px);
        backdrop-filter: blur(8px);
      }
      #instagram-link:hover,
      #instagram-link:focus-visible {
        border-color: rgba(255, 190, 220, 0.7);
        background: rgba(75, 28, 62, 0.82);
        outline: none;
      }
      #hud {
        position: fixed;
        left: 20px;
        bottom: 18px;
        font-size: 13px;
        letter-spacing: 0.02em;
        opacity: 0.75;
        font-variant-numeric: tabular-nums;
        text-shadow: 0 1px 6px #000;
      }
      #status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        text-align: center;
        font-size: 18px;
        padding: 24px;
        pointer-events: none;
        text-shadow: 0 1px 12px #000;
        transition: opacity 0.4s;
      }
    </style>
  </head>
  <body>
    <video id="cam" autoplay playsinline muted></video>
    <canvas id="skeleton"></canvas>
    <canvas id="scene"></canvas>
    <a
      id="instagram-link"
      href="https://www.instagram.com/_akash._t/"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Visit Instagram profile @_akash._t"
    >Instagram <span aria-hidden="true">&nearr;</span></a>
    <div id="status">Loading model and camera…</div>
    <div id="hud"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
